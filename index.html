<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UTRUX - 30s Reel</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,"Tahoma",sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#app{
    position:relative;
    width:min(100vw,56.25vh);
    height:min(177.7778vw,100vh);
    max-width:100vw;
    max-height:100vh;
    overflow:hidden;
    background:#182333;
}

/* ---------------- SCENE ---------------- */

.scene{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 1s ease;
}

.scene.active{
    opacity:1;
}

/* آسمان */

.sky{
    position:absolute;
    inset:0;
    background:
      linear-gradient(
        #172554 0%,
        #1d4ed8 35%,
        #64748b 65%,
        #263242 100%
      );
}

.sun{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    top:13%;
    right:13%;
    background:#f8fafc;
    box-shadow:0 0 60px rgba(255,255,255,.45);
}

/* ساختمان‌ها */

.city{
    position:absolute;
    bottom:25%;
    width:100%;
    height:35%;
}

.building{
    position:absolute;
    bottom:0;
    background:#182231;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}

.building:nth-child(1){right:0;width:23%;height:75%}
.building:nth-child(2){right:21%;width:20%;height:55%}
.building:nth-child(3){right:39%;width:22%;height:90%}
.building:nth-child(4){right:59%;width:18%;height:62%}
.building:nth-child(5){right:75%;width:25%;height:78%}

.window{
    position:absolute;
    width:7px;
    height:10px;
    background:#f8fafc;
    opacity:.18;
    box-shadow:
      15px 0 #f8fafc,
      30px 0 #f8fafc,
      0 22px #f8fafc,
      15px 22px #f8fafc,
      30px 22px #f8fafc;
}

/* زمین */

.ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:27%;
    background:#202936;
}

.road{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:75%;
    height:100%;
    background:#111827;
    clip-path:polygon(27% 0,73% 0,100% 100%,0 100%);
}

.roadLine{
    position:absolute;
    bottom:0;
    left:50%;
    width:5px;
    height:70px;
    transform:translateX(-50%);
    background:#eee;
    opacity:.6;
}

/* ---------------- CHARACTERS ---------------- */

.person{
    position:absolute;
    width:125px;
    height:270px;
    bottom:24%;
    z-index:20;
}

/* سر */

.head{
    position:absolute;
    top:0;
    left:25px;
    width:75px;
    height:82px;
    border-radius:46% 46% 42% 42%;
    background:
      radial-gradient(
        circle at 40% 30%,
        #dca77b,
        #a96f4d 75%
      );
    box-shadow:
      inset -8px -8px 15px rgba(0,0,0,.18),
      0 5px 10px rgba(0,0,0,.3);
}

/* گوش */

.ear{
    position:absolute;
    width:13px;
    height:22px;
    top:30px;
    background:#b97d59;
    border-radius:50%;
}

.ear.left{left:17px}
.ear.right{right:17px}

/* چشم */

.eye{
    position:absolute;
    top:36px;
    width:7px;
    height:5px;
    border-radius:50%;
    background:#111;
}

.eye.left{left:43px}
.eye.right{right:43px}

/* بینی */

.nose{
    position:absolute;
    top:42px;
    left:50%;
    width:7px;
    height:13px;
    transform:translateX(-50%);
    border-right:2px solid rgba(0,0,0,.2);
}

/* دهان */

.mouth{
    position:absolute;
    left:50%;
    top:61px;
    width:24px;
    height:7px;
    transform:translateX(-50%);
    border-bottom:2px solid #512d24;
    border-radius:50%;
}

/* مو / ریش */

.beard{
    position:absolute;
    left:11px;
    right:11px;
    bottom:-1px;
    height:42px;
    background:#242424;
    border-radius:0 0 35px 35px;
}

.hair{
    position:absolute;
    left:4px;
    right:4px;
    top:-10px;
    height:25px;
    background:#171717;
    border-radius:50% 50% 20% 20%;
}

/* بدن */

.body{
    position:absolute;
    top:78px;
    left:12px;
    width:101px;
    height:125px;
    border-radius:25px 25px 10px 10px;
    background:linear-gradient(90deg,#111827,#374151,#111827);
    box-shadow:0 10px 20px rgba(0,0,0,.25);
}

/* لباس شخصیت دوم */

.person.two .body{
    background:linear-gradient(90deg,#292524,#57534e,#292524);
}

/* بازوها */

.arm{
    position:absolute;
    top:88px;
    width:22px;
    height:105px;
    border-radius:20px;
    background:#b77a57;
    z-index:-1;
}

.arm.left{
    left:0;
    transform:rotate(7deg);
}

.arm.right{
    right:0;
    transform:rotate(-7deg);
}

/* پاها */

.leg{
    position:absolute;
    top:190px;
    width:35px;
    height:80px;
    background:#111827;
    border-radius:5px 5px 12px 12px;
}

.leg.left{left:28px}
.leg.right{right:28px}

/* کفش */

.shoe{
    position:absolute;
    bottom:-3px;
    width:47px;
    height:17px;
    background:#080808;
    border-radius:15px;
}

.shoe.left{left:18px}
.shoe.right{right:18px}

/* شخصیت اول */

#p1{
    left:40%;
    transform:translateX(-50%);
}

/* شخصیت دوم */

#p2{
    left:-150px;
}

/* ---------------- SUITCASE ---------------- */

.suitcase{
    position:absolute;
    width:60px;
    height:45px;
    bottom:28%;
    left:-80px;
    z-index:25;
    border-radius:6px;
    background:linear-gradient(#4c1d95,#6d28d9);
    box-shadow:0 8px 15px rgba(0,0,0,.35);
}

.suitcase:before{
    content:"";
    position:absolute;
    width:22px;
    height:12px;
    left:18px;
    top:-10px;
    border:3px solid #c4b5fd;
    border-bottom:0;
    border-radius:7px 7px 0 0;
}

/* ---------------- CROWD ---------------- */

.crowd{
    position:absolute;
    bottom:22%;
    width:100%;
    height:90px;
    display:flex;
    justify-content:center;
    gap:4px;
    z-index:12;
}

.smallPerson{
    position:relative;
    width:25px;
    height:75px;
}

.smallPerson .h{
    position:absolute;
    width:19px;
    height:19px;
    left:3px;
    border-radius:50%;
    background:#b77955;
}

.smallPerson .b{
    position:absolute;
    top:17px;
    width:25px;
    height:50px;
    border-radius:10px;
    background:#374151;
}

/* ---------------- TEXT ---------------- */

.text{
    position:absolute;
    top:8%;
    width:100%;
    padding:0 20px;
    text-align:center;
    color:#fff;
    font-size:24px;
    line-height:1.7;
    font-weight:800;
    text-shadow:0 3px 12px #000;
    opacity:0;
    transform:translateY(20px);
    transition:.6s;
    z-index:100;
}

.text.show{
    opacity:1;
    transform:translateY(0);
}

/* ---------------- DARK OVERLAY ---------------- */

.dark{
    position:absolute;
    inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:150;
    transition:opacity 1.2s;
}

/* ---------------- UTRUX ---------------- */

.logo{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Arial,sans-serif;
    font-size:62px;
    font-weight:900;
    letter-spacing:7px;
    text-shadow:
      0 0 20px #60a5fa,
      0 0 60px #2563eb;
    opacity:0;
    transform:scale(.5);
    z-index:200;
    transition:1.8s cubic-bezier(.2,.8,.2,1);
}

.logo.show{
    opacity:1;
    transform:scale(1);
}

/* ---------------- START ---------------- */

#start{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    background:
      radial-gradient(circle at center,#172554,#020617 70%);
}

#start h1{
    margin:0;
    color:#fff;
    font-size:55px;
    font-family:Arial,sans-serif;
    letter-spacing:6px;
}

#start p{
    margin:0;
    color:#cbd5e1;
    font-size:15px;
}

#play{
    border:0;
    padding:15px 35px;
    border-radius:40px;
    background:#2563eb;
    color:#fff;
    font-size:18px;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 0 30px rgba(37,99,235,.4);
}

#play:active{
    transform:scale(.96);
}

/* ---------------- REPLAY ---------------- */

#replay{
    position:absolute;
    z-index:600;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.7);
    color:white;
    padding:10px 20px;
    border-radius:30px;
    font-family:inherit;
    cursor:pointer;
}
</style>
</head>
