<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTRUX Reel</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Vazirmatn, sans-serif;
}

#stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 56.25vh;
    margin: auto;
    overflow: hidden;
    background: #101827;
}

/* ---------------- BACKGROUND ---------------- */

.sky {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            #172554 0%,
            #2563eb 42%,
            #64748b 43%,
            #334155 100%
        );
}

.sun {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #f8fafc;
    top: 12%;
    right: 15%;
    box-shadow: 0 0 70px rgba(255,255,255,.45);
}

.city {
    position: absolute;
    bottom: 31%;
    width: 100%;
    height: 22%;
}

.building {
    position: absolute;
    bottom: 0;
    background: #172033;
    border-top: 2px solid rgba(255,255,255,.08);
}

.b1 {right:2%; width:22%; height:80%}
.b2 {right:23%; width:18%; height:55%}
.b3 {right:41%; width:20%; height:95%}
.b4 {right:61%; width:16%; height:65%}
.b5 {right:77%; width:23%; height:82%}

.building::after {
    content:"";
    position:absolute;
    inset:10px;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.08) 0 4px,
        transparent 4px 15px
      );
}

/* ---------------- GROUND ---------------- */

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 32%;
    background:
        linear-gradient(#334155, #111827);
}

.road {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 72%;
    height: 100%;
    background: #1e293b;
    clip-path: polygon(28% 0,72% 0,100% 100%,0 100%);
}

.road-line {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 80px;
    background: #f8fafc;
    bottom: 5%;
    opacity: .6;
}

/* ---------------- CROWD ---------------- */

.crowd {
    position: absolute;
    bottom: 25%;
    width: 100%;
    height: 90px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.person {
    position: relative;
    width: 28px;
    height: 75px;
}

.head {
    position: absolute;
    top: 0;
    left: 5px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #d6a77a;
}

.body {
    position: absolute;
    top: 17px;
    left: 1px;
    width: 26px;
    height: 45px;
    border-radius: 12px 12px 4px 4px;
    background: #475569;
}

.arm {
    position:absolute;
    top:22px;
    width:7px;
    height:32px;
    border-radius:8px;
    background:#d6a77a;
}

.arm.left {left:-4px; transform:rotate(15deg)}
.arm.right {right:-4px; transform:rotate(-15deg)}

/* ---------------- CHARACTERS ---------------- */

.character {
    position: absolute;
    width: 110px;
    height: 240px;
    bottom: 27%;
    z-index: 10;
    transition: none;
}

.character .head {
    width: 70px;
    height: 70px;
    left: 20px;
    top: 0;
    background: #c99168;
    border: 3px solid rgba(0,0,0,.25);
}

.character .body {
    width: 100px;
    height: 125px;
    left: 5px;
    top: 65px;
    background: #374151;
    border-radius: 25px 25px 10px 10px;
}

.character .arm {
    width: 17px;
    height: 95px;
    top: 78px;
    background: #c99168;
}

.character .arm.left {
    left: -8px;
}

.character .arm.right {
    right: -8px;
}

.leg {
    position:absolute;
    width:28px;
    height:70px;
    top:180px;
    background:#111827;
    border-radius:0 0 12px 12px;
}

.leg.left {left:20px}
.leg.right {right:20px}

/* کلاه/مو برای تفاوت شخصیت‌ها */

.charA .head::before {
    content:"";
    position:absolute;
    left:7px;
    top:-7px;
    width:56px;
    height:25px;
    border-radius:50% 50% 20% 20%;
    background:#111827;
}

.charB .head::before {
    content:"";
    position:absolute;
    left:8px;
    top:-4px;
    width:54px;
    height:20px;
    border-radius:50%;
    background:#e5e7eb;
}

/* ---------------- PROPS ---------------- */

.suitcase {
    position:absolute;
    width:55px;
    height:40px;
    border-radius:5px;
    background:#7c3aed;
    bottom:31%;
    left:-70px;
    z-index:8;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.suitcase::before {
    content:"";
    position:absolute;
    width:20px;
    height:10px;
    border:3px solid #c4b5fd;
    border-bottom:0;
    left:15px;
    top:-10px;
    border-radius:5px 5px 0 0;
}

/* ---------------- TEXT ---------------- */

.caption {
    position:absolute;
    top:8%;
    width:100%;
    padding:0 25px;
    text-align:center;
    color:white;
    font-size:25px;
    font-weight:800;
    text-shadow:0 3px 10px #000;
    opacity:0;
    transform:translateY(20px);
    z-index:50;
}

.caption.show {
    animation:textIn .8s forwards;
}

@keyframes textIn {
    to {
        opacity:1;
        transform:translateY(0);
    }
}

/* ---------------- UTRUX ---------------- */

.utrux {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.4);
    font-family:Arial,sans-serif;
    font-size:70px;
    font-weight:900;
    letter-spacing:8px;
    color:white;
    text-shadow:
        0 0 20px #3b82f6,
        0 0 60px #2563eb;
    opacity:0;
    z-index:100;
}

.utrux.show {
    animation:logoIn 2s forwards;
}

@keyframes logoIn {
    0% {
        opacity:0;
        transform:translate(-50%,-50%) scale(.3);
        filter:blur(15px);
    }
    60% {
        opacity:1;
        transform:translate(-50%,-50%) scale(1.1);
        filter:blur(0);
    }
    100% {
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* ---------------- VIGNETTE ---------------- */

.vignette {
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:200;
    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.55) 100%
        );
}

/* ---------------- CONTROLS ---------------- */

.controls {
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:500;
}

button {
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.6);
    color:white;
    padding:10px 18px;
    border-radius:25px;
    cursor:pointer;
    font-family:inherit;
}

button:hover {
    background:rgba(255,255,255,.15);
}
</style>
</head>
