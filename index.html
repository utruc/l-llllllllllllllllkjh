```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTRUX Intro</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020617;
    font-family: "Vazirmatn", sans-serif;
}

.video {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, #1e40af 0%, #0f172a 38%, #020617 75%);
}

/* نور وسط */
.glow {
    position: absolute;
    width: 45vw;
    height: 45vw;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #2563eb;
    filter: blur(100px);
    opacity: 0;
    animation: glowIn 2s ease forwards;
}

@keyframes glowIn {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.3);
    }
    100% {
        opacity: .22;
        transform: translate(-50%, -50%) scale(1);
    }
}

/* ستاره‌ها */
.stars {
    position: absolute;
    inset: 0;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: .5;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .15; }
    to { opacity: .8; }
}

/* لوگو */
.logo {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%) scale(.5);
    opacity: 0;

    font-family: Arial, sans-serif;
    font-size: clamp(55px, 10vw, 150px);
    font-weight: 900;
    letter-spacing: .12em;

    color: white;
    text-shadow:
        0 0 15px rgba(59,130,246,.8),
        0 0 40px rgba(37,99,235,.5);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1) 1s forwards,
        logoFloat 3s ease-in-out 2.5s infinite;
}

@keyframes logoIn {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.5);
        filter: blur(15px);
    }

    60% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
        filter: blur(0);
    }

    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes logoFloat {
    0%,100% {
        transform: translate(-50%, -50%);
    }

    50% {
        transform: translate(-50%, calc(-50% - 8px));
    }
}

/* متن */
.greeting {
    position: absolute;
    left: 50%;
    top: 59%;
    transform: translate(-50%, 20px);

    width: 100%;
    text-align: center;

    color: white;
    font-size: clamp(22px, 4vw, 52px);
    font-weight: 600;

    opacity: 0;

    animation:
        greetingIn 1.2s ease 2.8s forwards;
}

@keyframes greetingIn {
    from {
        opacity: 0;
        transform: translate(-50%, 30px);
        filter: blur(10px);
    }

    to {
        opacity: 1;
        transform: translate(-50%, 0);
        filter: blur(0);
    }
}

/* خط پایین */
.line {
    position: absolute;
    left: 50%;
    top: 68%;
    width: 0;
    height: 2px;
    transform: translateX(-50%);

    background: white;
    box-shadow: 0 0 15px #60a5fa;

    animation: lineIn 1s ease 3.4s forwards;
}

@keyframes lineIn {
    from { width: 0; opacity: 0; }
    to {
        width: min(320px, 55vw);
        opacity: .8;
    }
}

/* دکمه شروع */
.start {
    position: absolute;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);

    padding: 10px 20px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 30px;

    color: rgba(255,255,255,.7);
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(10px);

    cursor: pointer;
    font-family: inherit;

    transition: .25s;
}

.start:hover {
    background: rgba(255,255,255,.13);
    color: white;
}
</style>
</head>

<body>

<div class="video">

    <div class="glow"></div>

    <div class="stars">
        <span class="star" style="left:8%;top:18%;animation-delay:.2s"></span>
        <span class="star" style="left:18%;top:72%;animation-delay:1s"></span>
        <span class="star" style="left:31%;top:25%;animation-delay:.5s"></span>
        <span class="star" style="left:68%;top:15%;animation-delay:1.3s"></span>
        <span class="star" style="left:82%;top:34%;animation-delay:.7s"></span>
        <span class="star" style="left:91%;top:76%;animation-delay:1.6s"></span>
        <span class="star" style="left:57%;top:82%;animation-delay:.4s"></span>
        <span class="star" style="left:42%;top:91%;animation-delay:1.1s"></span>
    </div>

    <div class="logo">UTRUX</div>

    <div class="greeting">
        سلام، من UTRUX هستم
    </div>

    <div class="line"></div>

    <button class="start" onclick="restart()">
        ↻ پخش دوباره
    </button>

</div>

<script>
function restart() {
    const video = document.querySelector(".video");

    video.style.display = "none";

    void video.offsetWidth;

    video.style.display = "block";
}
</script>

</body>
</html>
```
